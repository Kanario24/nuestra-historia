[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-video-marketing-agent"
version = "0.1.0"
description = "Agente de edición de vídeo y marketing para Claude Code: planifica, edita con FFmpeg, revisa y exporta vídeos listos para publicar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AI Video Marketing Agent contributors" }]
keywords = ["video", "ffmpeg", "marketing", "claude-code", "skill", "tiktok", "reels", "shorts"]
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
video-agent = "video_agent.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/video_agent"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "video_agent/_resources/config"
"templates" = "video_agent/_resources/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: renderizados completos a resolución real (lentos)",
  "transcription: requieren faster-whisper y un modelo Whisper disponible",
  "external: requieren claves de API y red (no se ejecutan por defecto)",
]
addopts = "-m 'not external'"
