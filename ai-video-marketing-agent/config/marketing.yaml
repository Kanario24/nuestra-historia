# Objetivos de marketing: adaptan gancho, estructura, ritmo y llamada a la acción.
# {brand} se sustituye por el nombre de la marca/producto. Los textos son un punto
# de partida profesional: el agente (Claude) debe reescribirlos para cada marca.
# Nunca se promete viralidad ni resultados garantizados.

goals:
  leads:
    label: Conseguir clientes
    keywords: [cliente, clientes, leads, captar, ventas, contrat, presupuesto]
    es:
      hooks: ["¿Tu negocio sigue perdiendo clientes?", "Esto le falta a tu empresa", "Deja de perder oportunidades"]
      problem: "Procesos lentos. Clientes que se van."
      solution: "{brand} lo resuelve por ti"
      benefits: ["Más clientes", "Menos trabajo manual", "Resultados medibles"]
      cta: "Pide tu presupuesto"
    en:
      hooks: ["Is your business still losing clients?", "Your company is missing this", "Stop losing opportunities"]
      problem: "Slow processes. Clients walking away."
      solution: "{brand} fixes it for you"
      benefits: ["More clients", "Less manual work", "Measurable results"]
      cta: "Get your quote"
  product:
    label: Promocionar un producto
    keywords: [producto, lanzamiento, nuevo, novedad, comprar, tienda, product, launch]
    es:
      hooks: ["Te presentamos {brand}", "Esto lo cambia todo", "Lo que estabas esperando"]
