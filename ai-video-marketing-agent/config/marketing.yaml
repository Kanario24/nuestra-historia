    es:
      hooks: ["Esto es {brand}", "Así trabajamos en {brand}", "Bienvenido a {brand}"]
      problem: "Las ideas necesitan a alguien que las construya."
      solution: "{brand} lo hace realidad"
      benefits: ["Innovación", "Diseño", "Compromiso"]
      cta: "Descubre {brand}"
    en:
      hooks: ["This is {brand}", "How we work at {brand}", "Welcome to {brand}"]
      problem: "Ideas need someone to build them."
      solution: "{brand} makes it real"
      benefits: ["Innovation", "Design", "Commitment"]
      cta: "Discover {brand}"
