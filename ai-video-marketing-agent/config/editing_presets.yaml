# Estilos de edición. Cada decisión (color, transición, ritmo, tipografía) está
# ligada al estilo para que el resultado sea coherente y no aleatorio.
#
# grade: cadena de filtros FFmpeg de corrección de color (vacía = sin cambios)
# transitions: transiciones xfade permitidas, por orden de preferencia
# shot_length: duración media de plano en segundos (ritmo)
# background: generador(es) local(es) de fondos (motion_graphics.py); con una lista se alternan por escena
# music: estilo de la música sintética local y tempo (solo si no aportas música)

styles:
  tech_dark:
    label: Tecnológico oscuro y elegante
    palette: ["#0A0E1A", "#12182B", "#00E5FF", "#7C4DFF", "#F5F7FF"]
    grade: "eq=contrast=1.08:saturation=0.92:brightness=-0.02,colorbalance=bs=0.06:bm=0.03"
    transitions: [fadeblack, smoothleft, slideup, zoomin, fade]
    transition_duration: 0.35
    shot_length: 2.2
    motion: [zoom_in, pan_right, zoom_out, pan_left]
    text_animation: slide_up
    background: [tech_grid, bokeh, tech_grid, spotlight]
    subtitle_style: dynamic
    music: {mood: electronic, bpm: 120}
  cinematic:
    label: Cinematográfico
    palette: ["#0B0B0D", "#1C1C22", "#E0A458", "#3D7EA6", "#F2EEE9"]
    grade: "eq=contrast=1.12:saturation=0.85,colorbalance=rs=-0.05:bs=0.08:rh=0.08:bh=-0.05,vignette=PI/5"
    transitions: [fadeblack, fade, dissolve]
    transition_duration: 0.7
    shot_length: 3.2
    motion: [zoom_in, pan_right, zoom_out]
    text_animation: fade
    background: spotlight
    subtitle_style: cinematic
    letterbox: true
    music: {mood: cinematic, bpm: 84}
  corporate:
    label: Corporativo limpio
    palette: ["#0F2A4A", "#1E4D7B", "#2BB3FF", "#FFFFFF", "#F2F5F9"]
    grade: "eq=contrast=1.03:saturation=1.02:brightness=0.01"
    transitions: [fade, slideleft, wipeleft]
    transition_duration: 0.45
    shot_length: 3.0
    motion: [zoom_in, zoom_out]
    text_animation: fade
    background: gradient
    subtitle_style: corporate
    music: {mood: corporate, bpm: 104}
  gaming:
    label: Gaming de cortes rápidos
    palette: ["#0D0221", "#261447", "#FF3864", "#2DE2E6", "#F6019D"]
    grade: "eq=contrast=1.15:saturation=1.3"
    transitions: [pixelize, slideleft, zoomin, fadewhite]
    transition_duration: 0.2
    shot_length: 1.2
    motion: [zoom_in, pan_left, zoom_out, pan_right]
    text_animation: slide_left
    background: [speed_lines, gradient]
    subtitle_style: gaming
    music: {mood: gaming, bpm: 140}
  automotive:
    label: Automoción premium
    palette: ["#060606", "#1A1A1A", "#D7263D", "#C0C0C0", "#FFFFFF"]
    grade: "eq=contrast=1.15:saturation=0.85:brightness=-0.03,vignette=PI/4.5"
    transitions: [fadeblack, smoothright, slideleft, fade]
    transition_duration: 0.4
    shot_length: 2.0
    motion: [pan_right, zoom_in, pan_left]
    text_animation: slide_left
    background: spotlight
    subtitle_style: cinematic
    music: {mood: electronic, bpm: 124}
  minimal:
    label: Minimalista
    palette: ["#FAFAFA", "#EDEDED", "#111111", "#FF5A36", "#111111"]
    grade: ""
    transitions: [fade, wipeleft]
    transition_duration: 0.4
    shot_length: 2.8
    motion: [zoom_in, zoom_out]
    text_animation: fade
    background: minimal
    subtitle_style: minimal
    music: {mood: chill, bpm: 96}
  energetic:
    label: Dinámico / redes sociales
    palette: ["#111827", "#1F2937", "#FACC15", "#22D3EE", "#FFFFFF"]
    grade: "eq=contrast=1.08:saturation=1.15"
    transitions: [slideup, zoomin, slideleft, fade]
    transition_duration: 0.25
    shot_length: 1.6
    motion: [zoom_in, pan_right, zoom_out, pan_left]
    text_animation: slide_up
    background: [gradient, bokeh]
    subtitle_style: dynamic
    music: {mood: electronic, bpm: 128}

# Palabras clave (es/en) que activan cada estilo en una petición en lenguaje natural.
# Se comparan sin tildes como inicio de palabra; las de 3 letras o menos, como palabra completa.
style_keywords:
  tech_dark: [tecnol, tech, oscur, dark, futur, software, digital, ia, ai, elegante, saas, app]
  cinematic: [cinemat, cine, épic, epic, film, emotiv, documental]
  corporate: [corporativ, empresa, institucional, profesional, b2b, consultor]
  gaming: [gaming, gamer, videojuego, juego, game, stream, twitch, esports]
  automotive: [coche, auto, carro, automoci, car, motor, deportivo, concesionario]
  minimal: [minimal, limpio, sencillo, clean, simple]
  energetic: [dinámic, dinamic, energ, rápid, viral, divertid, fun]
